<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCREAM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="controls">
    <label>Mode
      <select id="mode">
        <option value="lift">Volume = lift</option>
        <option value="flap">Volume = flap</option>
      </select>
    </label>
    <label>Sensitivity <input id="sens" type="range" min="0.5" max="2" step="0.1" value="1"></label>
    <button id="recal">Recalibrate</button>
  </div>
</div>
<script src="src/audio.js"></script>
<script src="src/bird.js"></script>
<script src="src/pipes.js"></script>
<script src="src/render.js"></script>
<script src="src/game.js"></script>
</body>
</html>
